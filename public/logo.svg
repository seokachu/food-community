<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 숨은맛집 앱 로고. BrandMark(브랜드 배경 + 라이트 글리프)와 같은 규격:
       배경 background-brand(brand-700), 글리프 icon-on-brand(neutral-50),
       라운드 비율 24/64 (512 * 0.375 = 192), 글리프 박스 폭 50%. -->
  <rect width="512" height="512" rx="192" fill="#087761"/>
  <g transform="translate(128 128) scale(10.6667)" fill="none" stroke="#FAFCFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
    <path d="M7 2v20"/>
    <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
  </g>
</svg>
